<script>
function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('menu-open')}
function enterSite(){document.getElementById('intro').classList.add('hide');}
const c=document.getElementById('webCanvas'), x=c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight} resize(); window.onresize=resize;
let t=0;
function draw(){
x.clearRect(0,0,c.width,c.height);
const w=c.width, h=c.height;
const ox=w*0.12, oy=h*0.85;
x.shadowBlur=8; x.shadowColor='rgba(255,255,255,0.4)';
// Arcs 3D
for(let r=50;r<w*1.6;r+=75){
x.strokeStyle='rgba(255,255,255,'+(0.25 - r*0.0001)+')';
x.lineWidth=1;
x.beginPath();
for(let a=-0.7;a<1.3;a+=0.02){
let wobble = Math.sin(a*4 + t*0.5)*4;
let px=ox+Math.cos(a)*(r+wobble);
let py=oy+Math.sin(a)*(r+wobble);
if(a==-0.7) x.moveTo(px,py); else x.lineTo(px,py);
}
x.stroke();
}
x.shadowBlur=0;
// Radial lines 3D with glow
for(let a=-0.7;a<1.3;a+=0.16){
x.strokeStyle='rgba(255,255,255,0.15)';
x.lineWidth=0.8;
x.beginPath();
x.moveTo(ox,oy);
x.lineTo(ox+Math.cos(a)*w*1.8, oy+Math.sin(a)*w*1.8);
x.stroke();
}
t+=0.02;
requestAnimationFrame(draw);
}
draw();
</script>
