<script>
function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('menu-open')}
function enterSite(){
const canvas=document.getElementById('webCanvas');
const content=document.getElementById('content');
canvas.classList.add('rising');
content.classList.add('rising');
setTimeout(()=>{document.getElementById('intro').classList.add('hide')},400);
}

const c=document.getElementById('webCanvas'), x=c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight} resize(); window.onresize=resize;
let t=0;
function draw(){
x.clearRect(0,0,c.width,c.height);
const w=c.width, h=c.height;

const ox=0, oy=h;
x.shadowBlur=12; x.shadowColor='rgba(255,255,255,0.3)';

for(let r=40;r<w*1.8;r+=68){
let alpha = 0.32 - r*0.00012;
if(alpha<0.05) alpha=0.05;
x.strokeStyle=`rgba(255,255,255,${alpha})`;
x.lineWidth=1;
x.beginPath();
for(let a=-0.15;a<1.45;a+=0.015){
let wobble = Math.sin(a*5 + t*0.4)*5 + Math.cos(r*0.01 + t)*3;
let px=ox+Math.cos(a)*(r+wobble);
let py=oy+Math.sin(a)*(r+wobble);
if(a==-0.15) x.moveTo(px,py); else x.lineTo(px,py);
}
x.stroke();
}
x.shadowBlur=0;

for(let a=0;a<1.45;a+=0.14){
x.strokeStyle='rgba(255,255,255,0.18)';
x.lineWidth=0.9;
x.beginPath();
x.moveTo(ox,oy);

let len = w*2;
let lx=ox+Math.cos(a)*len;
let ly=oy+Math.sin(a)*len * -1;
x.lineTo(lx,ly);
x.stroke();
}
t+=0.025;
requestAnimationFrame(draw);
}
draw();
</script>
